# main 브랜치에 push하면 대시보드를 테스트·빌드해 GitHub Pages로 배포한다.
# 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions"로 한 번 설정해야 한다.
# 배포 결과
#   /              SEM-EDS 대시보드(웹판) — dashboard/public/shared-data/dataset.json 이 있으면 팀 공유 데이터셋으로 열림
#   /offline.html  오프라인판(HTML 파일 하나, 공유 데이터셋 포함) — 내려받아 더블클릭으로 열기
#   /legacy/       기존 단일 이미지 분석기(docs/)
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:offline
      - name: Assemble site
        run: |
          mkdir -p ../_site/legacy
          cp -r dist/. ../_site/
          cp "dist-offline/SEM-EDS 대시보드 (오프라인).html" ../_site/offline.html
          cp -r ../docs/. ../_site/legacy/
          touch ../_site/.nojekyll
          ls -la ../_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
